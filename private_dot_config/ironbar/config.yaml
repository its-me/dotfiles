# https://github.com/JakeStanger/ironbar/wiki/configuration-guide

name: main
position: top
height: 24
icon_theme: Adwaita
start:
  - type: menu
    center:
      - type: xdg_entry
        label: Accessories
        icon: accessories
        categories:
          - Accessibility
          - Core
          - Legacy
          - Utility
      - type: xdg_entry
        label: Development
        icon: applications-development
        categories:
          - Development
      - type: xdg_entry
        label: Education
        icon: applications-education
        categories:
          - Education
      - type: xdg_entry
        label: Games
        icon: applications-games
        categories:
          - Games
      - type: xdg_entry
        label: Graphics
        icon: applications-graphics
        categories:
          - Graphics
      - type: xdg_entry
        label: Multimedia
        icon: applications-multimedia
        categories:
          - Audio
          - Video
          - AudioVideo
      - type: xdg_entry
        label: Network
        icon: applications-internet
        categories:
          - Network
      - type: xdg_entry
        label: Office
        icon: applications-office
        categories:
          - Office
      - type: xdg_entry
        label: Science
        icon: applications-science
        categories:
          - Science
      - type: xdg_entry
        label: System
        icon: applications-system
        categories:
          - Emulator
          - System
      - type: xdg_other
      - type: xdg_entry
        label: Settings
        icon: preferences-system
        categories:
          - Settings
          - Screensaver
  - type: workspaces
end:
  - type: inhibit
    format_on: " "
    format_off: " "
  - type: script
    cmd: "~/.config/ironbar/updates.sh"
    mode: poll
    interval: 10800000
    tooltip: "{{~/.config/ironbar/arch_updates.sh | jq -r '.tooltip'}}"
  - type: custom
    name: claude-usage
    class: claude-usage
    bar:
      - type: button
        label: "{{60000:~/.config/ironbar/claude_usage.sh}}"
    popup:
      - type: label
        label: "{{60000:~/.config/ironbar/claude_usage_popup.sh}}"
    on_mouse_enter: "ironbar bar main show-popup claude-usage"
    on_mouse_exit: "ironbar bar main hide-popup"
  - type: sys_info
    format:
      - "  {load_average_1} {load_average_5} {load_average_15}"
      - "  {cpu_percent}%"
      - "  {memory_percent}%"
      - "  {disk_free#G@/:.2}"
    interval:
      cpu: 1
      disks: 5
  - type: volume
    format: "{icon} {percentage}%"
    mute_format: "  {percentage}%"
    max_volume: 150
    show_sources: false
    icons:
      volume_high: ""
      volume_medium: ""
      volume_low: ""
      muted: ""
    on_scroll_up: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.5"
    on_scroll_down: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
  - type: volume
    format: " {percentage}%"
    mute_format: "  {percentage}%"
    max_volume: 150
    show_sinks: false
    on_scroll_up: "wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%+ -l 1.5"
    on_scroll_down: "wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%-"
  - type: script
    cmd: "~/.config/ironbar/network.sh"
    mode: poll
    interval: 5000
  - type: brightness
    format: " {percentage}%"
  - type: script
    cmd: "~/.config/ironbar/battery.sh"
    mode: poll
    interval: 60000
  - type: script
    cmd: "~/.config/ironbar/keyboard_layout.sh"
    mode: poll
    interval: 1000
  - type: clock
    format: "󰥔 %Y-%m-%d %H:%M:%S"
    format_popup: "%Y-%m-%d %H:%M:%S GMT%:::z"
  - type: tray
    icon_size: 18
  - type: notifications
  - type: custom
    name: power-menu
    class: power-menu
    bar:
      - type: button
        name: power-btn
        label: "⏻ "
        on_click: popup:toggle
    popup:
      - type: box
        orientation: vertical
        widgets:
          - type: button
            class: power-btn
            label: "<span>󰐥</span>"
            on_click: "!shutdown now"
          - type: button
            class: power-btn
            label: "<span>󰜉</span>"
            on_click: "!reboot"
